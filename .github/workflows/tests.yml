name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: |
          node --check app.js
          node --check foods.js
          node --check sw.js
      - name: Run tests
        run: python -m pytest tests -q
